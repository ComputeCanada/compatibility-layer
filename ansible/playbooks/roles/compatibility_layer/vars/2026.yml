# Vars file for the compatibility layer of CC StdEnv/2026
---
eessi_version: "2026"
eessi_host_os: linux
eessi_host_arch: "{{ ansible_architecture }}"

custom_overlays:
    - name: computecanada
      source: git
      url: https://github.com/ComputeCanada/gentoo-overlay.git
      eclass-overrides: true
      branch: 2026
      commit: HEAD

config_git_repo: https://github.com/ComputeCanada/gentoo-config.git

cvmfs_repository: cvmfs.computecanada.ca

gentoo_prefix_path: /cvmfs/{{ cvmfs_repository }}/gentoo/{{ eessi_version }}/x86-64-v3

# Select a specific commit in the gentoo_git_repo that should be used for the bootstrap,
# e.g. by checking: https://github.com/gentoo/gentoo/commits/master
# July 7 2026
gentoo_git_commit: 6916d96a84f1832cf1ce305a6a87053d8d4b0128
prefix_required_space: 15 GB
prefix_user_defined_trusted_dirs:
    - "/cvmfs/{{ cvmfs_repository }}/gentoo/{{ eessi_version }}/x86-64-v3/lib/override"
    - "/cvmfs/{{ cvmfs_repository }}/gentoo/{{ eessi_version }}/x86-64-v3/lib/nvidia"
    - "/cvmfs/{{ cvmfs_repository }}/gentoo/{{ eessi_version }}/x86-64-v3/lib/amd"

prefix_make_conf_files: {}
prefix_package_env_files: {}
prefix_profile_package_use_mask:

# USE flags to mask only during bootstrap until halfway stage3 (where it syncs)
prefix_temp_package_use_mask: |
    app-admin/eselect emacs
    dev-db/sqlite icu
    dev-lang/python bluetooth
    net-misc/curl brotli
    sys-devel/gcc graphite
    sys-devel/gettext emacs
    sys-libs/zlib minizip

prefix_custom_bootstrap_script:
    local: "{{ playbook_dir }}/../../bootstrap-prefix-upstream.sh"
    remote: /tmp/bootstrap-prefix.sh

prefix_locales:
    - en_US.UTF-8 UTF-8
    - en_CA.UTF-8 UTF-8
    - fr_CA.UTF-8 UTF-8
    - en_GB.UTF-8 UTF-8

package_sets:
    - 2026

prefix_packages:
    - dev-python/pip

prefix_remove_packages:
    - app-eselect/eselect-rust
    - dev-lang/go
    - dev-lang/go-bootstrap
    - dev-lang/rust
    - dev-lang/rust-bin
    - dev-python/pip
    - dev-python/setuptools-rust
    - dev-util/cmake
    - dev-util/hermes
    - dev-util/ninja
    - virtual/rust

# version of ReFrame to use for running the tests
# stick to 4.9.3 for now, as 4.10.0 required a newer Rust in the container
reframe_version: 4.9.3

# List of locations that should get a (variant) symlink $EPREFIX/$LOCATION -> $LOCATION.
# This ensures that things like user/group ids are correct/looked up in the right way in the Prefix environment.
symlinks_to_host:
    # AMD trusted dir, see prefix_user_defined_trusted_dirs
    - dest: "{{ gentoo_prefix_path }}/lib/amd"
      src: "$(EESSI_{{ eessi_version | replace('.', '') }}_AMD_OVERRIDE:-/cvmfs/{{ cvmfs_repository }}/defaults/amd)"

    # NVIDIA trusted dir, see prefix_user_defined_trusted_dirs
    - dest: "{{ gentoo_prefix_path }}/lib/nvidia"
      src: "$(EESSI_{{ eessi_version | replace('.', '') }}_NVIDIA_OVERRIDE:-/cvmfs/{{ cvmfs_repository }}/defaults/nvidia)"

    # generic override trusted dir, see prefix_user_defined_trusted_dirs
    - dest: "{{ gentoo_prefix_path }}/lib/override"
      src: "$(EESSI_{{ eessi_version | replace('.', '') }}_LIB_OVERRIDE:-/cvmfs/{{ cvmfs_repository }}/defaults/override)"

